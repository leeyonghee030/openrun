# 로컬 개발용 MySQL, Redis. 비밀번호는 .env 파일에서 읽는다 (.env.example 참고)
services:
  mysql:
    image: mysql:8.4
    container_name: openrun-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 파일을 먼저 만드세요 (.env.example 복사)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?.env 파일을 먼저 만드세요}
      MYSQL_USER: ${MYSQL_USER:?.env 파일을 먼저 만드세요}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env 파일을 먼저 만드세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"   # 내 컴퓨터에서만 접속 가능. 왼쪽(3307)이 내 컴퓨터 포트, 오른쪽(3306)은 컨테이너 안의 포트. 3306이 이미 쓰여서 3307을 쓴다
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: openrun-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # 내 컴퓨터에서만 접속 가능
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
